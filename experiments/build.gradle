plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'edu.icesi.mio.experiments.BenchmarkApplication'
}

tasks.register('runMonolithic', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.icesi.mio.experiments.MonolithicApplication'
}

tasks.register('runConcurrent', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.icesi.mio.experiments.ConcurrentApplication'
}

tasks.register('runCompare', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.icesi.mio.experiments.BenchmarkApplication'
}
tasks.register('runDistributed', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.icesi.mio.experiments.DistributedBenchmarkApplication'
}