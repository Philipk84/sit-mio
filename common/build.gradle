application {
    mainClass = 'edu.icesi.mio.common.Noop'
}

def generatedSliceSource = file("$projectDir/src/main/java")

tasks.register('generateSlice', Exec) {
    inputs.file("$rootDir/slice/Mio.ice")
    outputs.dir("$projectDir/src/main/java/Mio")
    doFirst {
        file("$projectDir/src/main/java/Mio").mkdirs()
    }
    def executableName = org.gradle.internal.os.OperatingSystem.current().isWindows() ? 'slice2java.exe' : 'slice2java'
    def iceHome = providers.environmentVariable('ICE_HOME').orNull
    def sliceExecutable = iceHome ? file("$iceHome/bin/$executableName").absolutePath : executableName
    commandLine sliceExecutable,
            '--output-dir', generatedSliceSource.absolutePath,
            "$rootDir/slice/Mio.ice"
}
